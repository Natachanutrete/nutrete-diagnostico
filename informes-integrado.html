<head>
<meta charset="utf-8">

<title>Nútrete · Diagnóstico Integrado</title>
<style>
:root{--ink:#17332f;--muted:#657570;--line:#dfe8e4;--bg:#f5f8f6;--card:#fff;--accent:#2f6f61;--accent2:#8cae7c;--warn:#d99a3d;--danger:#c75b52;--ok:#5f9a70;--shadow:0 10px 28px rgba(23,51,47,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}.app{max-width:1440px;margin:auto;padding:24px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.04em}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;color:var(--ink);cursor:pointer;font-weight:700}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.tab{padding:11px 16px;border-radius:999px;background:#eaf0ed;color:#58706a;font-weight:700;white-space:nowrap}.tab.active{background:var(--ink);color:#fff}.report{display:grid;gap:18px}.hero{background:linear-gradient(135deg,#17332f,#2f6f61);color:#fff;border-radius:24px;padding:34px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr .8fr;gap:28px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;opacity:.72;font-weight:800}.hero h1{font-size:38px;line-height:1.05;margin:10px 0}.hero p{opacity:.9;max-width:760px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta div{background:rgba(255,255,255,.1);padding:14px;border-radius:14px}.meta small{display:block;opacity:.7}.meta strong{display:block;margin-top:3px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.kpi{background:#fff;color:var(--ink);border-radius:16px;padding:15px}.kpi b{font-size:26px;display:block}.kpi span{font-size:12px;color:var(--muted)}.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.section h2{margin:0 0 5px;font-size:23px}.section-intro{color:var(--muted);margin:0 0 20px}.ibin{display:grid;grid-template-columns:180px 1fr 270px;gap:24px;align-items:center}.score{font-size:56px;font-weight:900;line-height:1}.level{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#eaf2ee;font-weight:800}.bar{height:14px;background:#e9efec;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:999px}.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}.dims{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.dim{border:1px solid var(--line);border-radius:16px;padding:15px}.dim:nth-child(n+5){grid-column:span 1}.dim-top{display:flex;justify-content:space-between;gap:8px}.dim h3{font-size:15px;margin:0}.mini-score{font-weight:900}.mini-bar{height:7px;background:#edf1ef;border-radius:9px;margin:12px 0 10px;overflow:hidden}.mini-bar i{display:block;height:100%;background:var(--accent2)}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#f0f4f2;color:#52645f}.priority-high{background:#f8e8e5;color:#9b4039}.priority-med{background:#fff1d9;color:#96641c}.priority-low{background:#e7f2e9;color:#41704b}.priority{display:grid;gap:10px}.prio-row{display:grid;grid-template-columns:28px 180px 1fr 110px;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e9efec;font-weight:900}.rec{color:#50615c;font-size:13px}.bars{display:grid;gap:13px}.barrow{display:grid;grid-template-columns:190px 1fr 55px;gap:12px;align-items:center}.barrow .bar{height:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.context-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.context-card{border:1px solid var(--line);padding:15px;border-radius:14px}.context-card small{color:var(--muted);display:block}.context-card strong{display:block;margin-top:4px}.clinical{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.clinical-card{border:1px solid var(--line);border-radius:16px;padding:16px}.signal{height:10px;border-radius:8px;background:#e9efec;overflow:hidden;margin:10px 0}.signal i{display:block;height:100%;width:var(--w);background:var(--c)}.note{font-size:12px;color:var(--muted)}.disclaimer{border-left:4px solid var(--warn);padding:12px 15px;background:#fff8ea;color:#6e541e;border-radius:8px;font-size:13px}.dept{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.dept-head{display:flex;justify-content:space-between;align-items:center}.findings{display:grid;gap:10px}.finding{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:15px;border:1px solid var(--line);border-radius:14px}.finding-num{width:34px;height:34px;border-radius:10px;background:#eaf2ee;display:grid;place-items:center;font-weight:900}.program{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.phase{border:1px solid var(--line);border-radius:16px;padding:18px;position:relative}.phase b{font-size:13px;color:var(--accent)}.phase h3{margin:6px 0}.phase p{color:var(--muted);font-size:13px}.phase .phase-priority{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef3f0}.exec{background:#17332f;color:#fff}.exec p{font-size:17px;max-width:1000px}.source{font-size:11px;color:var(--muted);margin-top:12px}.hidden{display:none!important}@media(max-width:1000px){.hero,.ibin,.grid2{grid-template-columns:1fr}.dims{grid-template-columns:repeat(2,1fr)}.clinical,.program,.context-grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.app{padding:12px}.hero{padding:22px}.hero h1{font-size:30px}.dims,.clinical,.program,.context-grid{grid-template-columns:1fr}.prio-row{grid-template-columns:28px 1fr}.prio-row .bar,.prio-row .rec{grid-column:2}.barrow{grid-template-columns:130px 1fr 45px}.meta{grid-template-columns:1fr}}
@media print{body{background:#fff}.toolbar,.tabs{display:none}.app{max-width:none;padding:0}.section,.hero{box-shadow:none;break-inside:avoid}.report{gap:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar"><div class="brand">NÚTRETE · INFORMES</div><div class="actions"><button class="btn" id="btnDemo">Cargar demo</button><button class="btn primary" onclick="window.print()">Imprimir / PDF</button></div></div>
  <nav class="tabs" aria-label="Informes"><span class="tab">Motor Nútrete</span><span class="tab">Diagnóstico Check-up</span><span class="tab active">Diagnóstico Integrado</span></nav>
  <main class="report" id="report"></main>
</div>
<script>
/*
  NÚTRETE — DIAGNÓSTICO INTEGRADO
  Archivo autónomo para subir a GitHub. No expone datos individuales.

  INTEGRACIÓN:
  1) Si tu app ya tiene datos cargados, llama:
     window.NutreteIntegrated.render(datos);
  2) También puedes asignar window.NUTRETE_INTEGRATED_DATA = datos antes de cargar este archivo.

  Contrato mínimo esperado:
  {
    empresa:{nombre, sesion, fecha, dotacion, areas:[{nombre,total}]},
    participacion:{encuestaRespondida, encuestaUniverso, checkupEvaluados, checkupUniverso},
    ibin:{score, dimensiones:[{nombre,score,prioridad,interes}], areas:[{nombre,n,score}]},
    necesidades:{temas:[{nombre,pct}], formatos:[{nombre,pct}]},
    gerencia:{items:[{label,value}]},
    checkup:{indicadores:[{nombre,pct,estado,unidad}], cardiovascular:{nivel,pct}, obesidad:{preclinicaPct,clinicaPct,criterio}, porArea:[{area,n,indicadores:{...}}]},
    hallazgos:[{titulo,evidencia,implicancia}],
    recomendaciones:[{dimension,prioridad,accion}],
    programa:{detecta:{prioridad,acciones},recarga:{prioridad,acciones},activa:{prioridad,acciones},reevalua:{prioridad,acciones}}
  }
*/
const DEMO={
 empresa:{nombre:'Empresa demostración',sesion:'Diagnóstico Integrado 2026',fecha:'31 agosto 2026',dotacion:184,areas:[{nombre:'Operaciones',total:92},{nombre:'Administración',total:48},{nombre:'Comercial',total:44}]},
 participacion:{encuestaRespondida:126,encuestaUniverso:184,checkupEvaluados:98,checkupUniverso:126},
 ibin:{score:62,dimensiones:[
  {nombre:'Alimentación',score:58,prioridad:'Prioritario',interes:72},
  {nombre:'Movimiento',score:54,prioridad:'Prioritario',interes:64},
  {nombre:'Sueño y recuperación',score:49,prioridad:'Alta prioridad',interes:81},
  {nombre:'Estrés y regulación',score:52,prioridad:'Prioritario',interes:86},
  {nombre:'Hidratación',score:71,prioridad:'En desarrollo',interes:55},
  {nombre:'Autocuidado',score:68,prioridad:'En desarrollo',interes:61},
  {nombre:'Entorno saludable',score:63,prioridad:'Adecuado',interes:69}
 ],areas:[{nombre:'Operaciones',n:62,score:55},{nombre:'Administración',n:36,score:68},{nombre:'Comercial',n:28,score:64}]},
 necesidades:{temas:[{nombre:'Sueño y recuperación',pct:81},{nombre:'Estrés y regulación',pct:76},{nombre:'Alimentación práctica',pct:72},{nombre:'Energía',pct:66},{nombre:'Actividad física',pct:59}],formatos:[{nombre:'Taller práctico',pct:78},{nombre:'Cápsulas digitales',pct:67},{nombre:'Experiencia presencial',pct:61},{nombre:'Webinar',pct:48}]},
 gerencia:{items:[{label:'Prioridad declarada',value:'Prevención y bienestar sostenible'},{label:'Principal desafío',value:'Baja adherencia a acciones de bienestar'},{label:'Formato más viable',value:'Intervenciones breves + continuidad'},{label:'Horizonte',value:'Plan trimestral con indicadores'},{label:'Áreas críticas',value:'Operaciones y turnos'},{label:'Recursos disponibles',value:'RR.HH. + Prevención + Bienestar'}]},
 checkup:{indicadores:[{nombre:'Presión arterial elevada',pct:28,estado:'Atención',unidad:'de evaluados'},{nombre:'Circunferencia de cintura elevada',pct:46,estado:'Atención',unidad:'de evaluados'},{nombre:'IMC ≥ 30 kg/m²',pct:31,estado:'Vigilancia',unidad:'de evaluados'},{nombre:'Glicemia alterada',pct:14,estado:'Vigilancia',unidad:'de evaluados'},{nombre:'Triglicéridos elevados',pct:22,estado:'Vigilancia',unidad:'de evaluados'}],cardiovascular:{nivel:'Vigilancia prioritaria',pct:34},obesidad:{preclinicaPct:24,clinicaPct:9,criterio:'Clasificación agregada orientativa: exceso de adiposidad + evidencia disponible de alteración funcional. No constituye diagnóstico individual.'},porArea:[{area:'Operaciones',n:62,indicadores:{'Cintura elevada':'52%','PA elevada':'34%','IMC ≥30':'35%'}},{area:'Administración',n:36,indicadores:{'Cintura elevada':'39%','PA elevada':'22%','IMC ≥30':'25%'}},{area:'Comercial',n:28,indicadores:{'Cintura elevada':'43%','PA elevada':'25%','IMC ≥30':'29%'}}]},
 hallazgos:[
  {titulo:'Sueño y regulación concentran la mayor demanda',evidencia:'81% prioriza sueño/recuperación y 86% declara interés en estrés y regulación.',implicancia:'La intervención inicial debe combinar recuperación, regulación y herramientas prácticas, no limitarse a educación alimentaria.'},
  {titulo:'La brecha de bienestar es mayor en Operaciones',evidencia:'IBIN por área: Operaciones 55 puntos, frente a 68 en Administración y 64 en Comercial.',implicancia:'Conviene diseñar una estrategia específica para turnos, pausas, alimentación disponible y recuperación.'},
  {titulo:'Existe una señal cardiometabólica relevante',evidencia:'46% presenta cintura elevada en el grupo evaluado y 28% presión arterial elevada.',implicancia:'Se recomienda priorizar prevención cardiometabólica y derivación individual cuando corresponda.'},
  {titulo:'El equipo prefiere formatos aplicados',evidencia:'78% prefiere talleres prácticos y 67% cápsulas digitales.',implicancia:'La propuesta debe combinar experiencias breves con continuidad digital para sostener adherencia.'}
 ],
 recomendaciones:[
  {dimension:'Sueño y recuperación',prioridad:'Alta',accion:'Implementar módulo de recuperación: sueño, pausas, exposición a pantallas, cafeína y rutina mínima nocturna.'},
  {dimension:'Estrés y regulación',prioridad:'Alta',accion:'Diseñar experiencias breves de regulación y autocuidado, con herramientas prácticas y seguimiento.'},
  {dimension:'Movimiento',prioridad:'Alta',accion:'Integrar micro-pausas y movimiento cotidiano adaptado a jornada y puestos de trabajo.'},
  {dimension:'Alimentación',prioridad:'Media',accion:'Trabajar alimentación práctica y entorno alimentario, especialmente en Operaciones.'},
  {dimension:'Prevención cardiometabólica',prioridad:'Alta',accion:'Realizar seguimiento agregado de indicadores y orientar evaluación individual/derivación según hallazgos clínicos.'}
 ],
 programa:{detecta:{prioridad:'Muy alta',acciones:'Presentar línea base; segmentar por área; acordar 2–3 indicadores de seguimiento.'},recarga:{prioridad:'Muy alta',acciones:'Sueño + estrés + alimentación práctica; talleres y cápsulas digitales.'},activa:{prioridad:'Alta',acciones:'Microacciones, pausas, movimiento y herramientas de autocuidado aplicadas al puesto.'},reevalua:{prioridad:'Alta',acciones:'Repetir encuesta y check-up según protocolo; comparar tendencias y ajustar intervención.'}}
};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function level(s){if(s>=80)return'Fortalecido';if(s>=65)return'Adecuado';if(s>=50)return'En desarrollo';if(s>=35)return'Prioritario';return'Alta prioridad'}
function pclass(p){return /Alta|Muy/.test(p)?'priority-high':/Media/.test(p)?'priority-med':'priority-low'}
function bar(label,pct,cls=''){return `<div class="barrow"><span>${esc(label)}</span><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div><strong>${pct}%</strong></div>`}
function render(d){
 const e=d.empresa||{}; const pa=d.participacion||{}; const i=d.ibin||{score:0,dimensiones:[],areas:[]}; const encRate=pa.encuestaUniverso?Math.round(pa.encuestaRespondida/pa.encuestaUniverso*100):0; const ckRate=pa.checkupUniverso?Math.round(pa.checkupEvaluados/pa.checkupUniverso*100):0;
 const dims=(i.dimensiones||[]).map(x=>`<div class="dim"><div class="dim-top"><h3>${esc(x.nombre)}</h3><span class="mini-score">${x.score}</span></div><div class="mini-bar"><i style="width:${x.score}%"></i></div><div class="tags"><span class="tag">${esc(level(x.score))}</span><span class="tag ${pclass(x.prioridad)}">${esc(x.prioridad)}</span><span class="tag">Interés ${x.interes}%</span></div></div>`).join('');
 const sorted=[...(i.dimensiones||[])].sort((a,b)=>a.score-b.score);
 const prios=sorted.map((x,n)=>`<div class="prio-row"><span class="rank">${n+1}</span><strong>${esc(x.nombre)}</strong><div><div class="bar"><div class="fill" style="width:${x.score}%"></div></div></div><span class="tag ${pclass(x.prioridad)}">${esc(x.prioridad)}</span><div class="rec">${recommendationFor(x.nombre)}</div></div>`).join('');
 const temas=(d.necesidades?.temas||[]).map(x=>bar(x.nombre,x.pct)).join(''); const formatos=(d.necesidades?.formatos||[]).map(x=>bar(x.nombre,x.pct)).join('');
 const ctx=(d.gerencia?.items||[]).map(x=>`<div class="context-card"><small>${esc(x.label)}</small><strong>${esc(x.value)}</strong></div>`).join('');
 const clinical=(d.checkup?.indicadores||[]).map(x=>{let c=x.estado==='Atención'?'#c75b52':x.estado==='Vigilancia'?'#d99a3d':'#5f9a70';return `<div class="clinical-card"><strong>${esc(x.nombre)}</strong><div class="signal"><i style="--w:${x.pct}%;--c:${c}"></i></div><b>${x.pct}%</b> <span class="note">${esc(x.unidad||'')}</span><div class="note">${esc(x.estado)}</div></div>`}).join('');
 const depts=(d.checkup?.porArea||[]).filter(x=>x.n>=5).map(x=>`<div class="dept"><div class="dept-head"><strong>${esc(x.area)}</strong><span class="tag">n=${x.n}</span></div><div class="bars">${Object.entries(x.indicadores||{}).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="bar"><div class="fill" style="width:${parseFloat(v)}%"></div></div><strong>${esc(v)}</strong></div>`).join('')}</div></div>`).join('');
 const findings=(d.hallazgos||[]).slice(0,5).map((x,n)=>`<div class="finding"><div class="finding-num">${n+1}</div><div><strong>${esc(x.titulo)}</strong><div class="note" style="margin-top:5px"><b>Evidencia:</b> ${esc(x.evidencia)}</div><div class="note" style="margin-top:5px"><b>Implicancia:</b> ${esc(x.implicancia)}</div></div></div>`).join('');
 const recs=(d.recomendaciones||[]).map(x=>`<div class="prio-row"><span class="rank">•</span><strong>${esc(x.dimension)}</strong><span class="tag ${pclass(x.prioridad)}">${esc(x.prioridad)}</span><div class="rec">${esc(x.accion)}</div></div>`).join('');
 const phases=[['Detecta',d.programa?.detecta],['Recarga',d.programa?.recarga],['Activa',d.programa?.activa],['Reevalúa',d.programa?.reevalua]].map(([name,x])=>`<div class="phase"><b>${name}</b><h3>${esc(x?.prioridad||'Prioridad definida')}</h3><p>${esc(x?.acciones||'')}</p><span class="phase-priority">Fase ${name}</span></div>`).join('');
 const cv=d.checkup?.cardiovascular||{}; const ob=d.checkup?.obesidad||{};
 const integrated=`<section class="hero"><div><div class="eyebrow">Nútrete · diagnóstico integrado</div><h1>${esc(e.nombre||'Empresa')}</h1><p>${esc(e.sesion||'Diagnóstico de bienestar corporativo')} · una lectura integrada de encuesta, contexto organizacional y check-up agregado.</p><div class="kpis"><div class="kpi"><b>${encRate}%</b><span>Participación encuesta</span></div><div class="kpi"><b>${ckRate}%</b><span>Cobertura check-up</span></div><div class="kpi"><b>${e.dotacion??'—'}</b><span>Dotación reportada</span></div><div class="kpi"><b>${i.score}</b><span>IBIN global</span></div></div></div><div class="meta"><div><small>Sesión</small><strong>${esc(e.sesion||'—')}</strong></div><div><small>Fecha</small><strong>${esc(e.fecha||'—')}</strong></div><div><small>Encuesta</small><strong>${pa.encuestaRespondida??'—'} / ${pa.encuestaUniverso??'—'}</strong></div><div><small>Check-up</small><strong>${pa.checkupEvaluados??'—'} / ${pa.checkupUniverso??'—'}</strong></div></div></section>
 <section class="section"><h2>Índice de Bienestar Integrado Nútrete (IBIN)</h2><p class="section-intro">Resultado global de la encuesta de bienestar y hábitos. La categoría se determina automáticamente según el score.</p><div class="ibin"><div><div class="score">${i.score}</div><span class="level">${level(i.score)}</span></div><div><div class="bar"><div class="fill" style="width:${i.score}%"></div></div><div class="scale"><span>Alta prioridad</span><span>Prioritario</span><span>En desarrollo</span><span>Adecuado</span><span>Fortalecido</span></div></div><div><strong>${ibinText(i.score)}</strong><p class="note">El IBIN orienta prioridades de intervención; no es un diagnóstico clínico.</p></div></div></section>
 <section class="section"><h2>Las 7 dimensiones</h2><p class="section-intro">Score, nivel, prioridad e interés declarado por el equipo.</p><div class="dims">${dims}</div></section>
 <section class="section"><h2>Mapa de prioridades</h2><p class="section-intro">Ordenado desde la brecha más relevante. La recomendación se genera por dimensión.</p><div class="priority">${prios}</div></section>
 <section class="section"><h2>Qué necesitan los trabajadores</h2><div class="grid2"><div><h3>Temas de mayor interés</h3><div class="bars">${temas}</div></div><div><h3>Formatos preferidos</h3><div class="bars">${formatos}</div></div></div></section>
 <section class="section"><h2>Contexto organizacional</h2><p class="section-intro">Información aportada por gerencia/RR.HH., presentada en lenguaje ejecutivo.</p><div class="context-grid">${ctx}</div></section>
 <section class="section"><h2>Check-up agregado</h2><p class="section-intro">Resultados grupales. No se muestran datos individuales. Los porcentajes representan la proporción de personas evaluadas que presenta cada señal o condición según el protocolo utilizado.</p><div class="clinical">${clinical}</div><div class="grid2" style="margin-top:18px"><div class="context-card"><small>Riesgo cardiovascular agregado</small><strong>${esc(cv.nivel||'No calculado')}</strong><div class="signal"><i style="--w:${cv.pct||0}%;--c:#d99a3d"></i></div><span class="note">${cv.pct??'—'}% de evaluados clasificados en el nivel mostrado.</span></div><div class="context-card"><small>Adiposidad y obesidad clínica · lectura agregada</small><strong>${ob.clinicaPct??'—'}% con criterio compatible con obesidad clínica en el grupo evaluado</strong><div class="signal"><i style="--w:${ob.clinicaPct||0}%;--c:#c75b52"></i></div><span class="note">${ob.preclinicaPct??'—'}% en categoría preclínica según variables disponibles.</span></div></div><div class="disclaimer" style="margin-top:16px"><b>Importante:</b> el marco de The Lancet distingue exceso de adiposidad/preclínica de obesidad clínica. El IMC no debe utilizarse como único diagnóstico individual; la confirmación requiere medidas de adiposidad y, para obesidad clínica, evidencia de alteración de función de órganos/tejidos o limitaciones relevantes. En este informe se aplica únicamente a datos agregados y según las variables realmente disponibles. No sustituye evaluación médica.</div><div class="source">Base metodológica: Rubino et al., <i>Lancet Diabetes &amp; Endocrinology</i>, 2025. DOI 10.1016/S2213-8587(24)00316-4.</div></section>
 <section class="section"><h2>Análisis por área</h2><p class="section-intro">IBIN y señales del check-up por departamento. Los grupos con menos de 5 personas se ocultan automáticamente.</p>${(i.areas||[]).filter(x=>x.n>=5).map(x=>`<div class="dept"><div class="dept-head"><strong>${esc(x.nombre)}</strong><span><b>IBIN ${x.score}</b> · n=${x.n}</span></div><div class="signal"><i style="--w:${x.score}%;--c:#2f6f61"></i></div><span class="note">${esc(level(x.score))}</span></div>`).join('')||'<p class="note">No hay áreas con n ≥ 5.</p'}${depts}</section>
 <section class="section"><h2>Lectura integrada</h2><p class="section-intro">La interpretación cruza encuesta, contexto de gerencia y check-up; no suma indicadores clínicos y de bienestar como si fueran una misma escala.</p><p>${integratedText(d)}</p></section>
 <section class="section"><h2>Hallazgos principales</h2><div class="findings">${findings}</div></section>
 <section class="section"><h2>Recomendaciones Nútrete</h2><p class="section-intro">Motor basado en reglas: prioriza las brechas con menor score, mayor interés y señales relevantes del check-up.</p><div class="priority">${recs}</div></section>
 <section class="section"><h2>Programa sugerido</h2><p class="section-intro">Arquitectura de intervención de 4 fases, ajustable según presupuesto, cobertura y resultados.</p><div class="program">${phases}</div></section>
 <section class="section exec"><h2>Conclusión ejecutiva</h2><p>${executiveText(d)}</p><div class="note" style="color:#cbd9d5">Documento para gestión de bienestar. Los resultados clínicos se presentan exclusivamente en forma agregada y deben interpretarse con el protocolo técnico y sanitario correspondiente.</div></section>`;
 document.getElementById('report').innerHTML=integrated;
}
function ibinText(s){if(s>=80)return'La organización muestra una base sólida de bienestar, con oportunidades de consolidación y prevención.';if(s>=65)return'Existe una base adecuada, pero algunas dimensiones requieren acciones específicas para sostener y mejorar el bienestar.';if(s>=50)return'El resultado muestra un nivel de desarrollo intermedio: conviene concentrar esfuerzos en las dimensiones con mayor brecha e interés.';if(s>=35)return'Existen brechas relevantes que justifican un plan priorizado y medible de intervención.';return'El resultado evidencia una necesidad alta de intervención estructurada y seguimiento.'}
function recommendationFor(n){const m={'Sueño y recuperación':'Programa de recuperación y sueño + seguimiento.','Estrés y regulación':'Regulación, pausas y autocuidado práctico.','Movimiento':'Micro-pausas y movimiento adaptado al puesto.','Alimentación':'Alimentación práctica y entorno alimentario.','Hidratación':'Disponibilidad, recordatorios y hábitos de hidratación.','Autocuidado':'Herramientas simples de autogestión y continuidad.','Entorno saludable':'Ajustes del entorno y facilitadores de hábitos.'};return m[n]||'Intervención específica según brecha e interés.'}
function integratedText(d){const i=d.ibin?.score??0;const top=(d.ibin?.dimensiones||[]).sort((a,b)=>a.score-b.score)[0];const cv=d.checkup?.cardiovascular?.nivel||'sin clasificación';return `La línea base muestra un IBIN de ${i} (${level(i)}), con ${top?top.nombre.toLowerCase():'las dimensiones prioritarias'} entre las principales brechas. El equipo expresa una demanda relevante por acciones prácticas y continuidad, mientras que el contexto de gerencia apunta a soluciones compatibles con la operación. El check-up agrega una señal de ${cv.toLowerCase()}, por lo que la estrategia recomendada combina promoción de hábitos, cambios facilitadores del entorno y prevención cardiometabólica. La lectura debe utilizarse para priorizar intervenciones y seguimiento, no para etiquetar individualmente a trabajadores.`}
function executiveText(d){const i=d.ibin?.score??0;const top=(d.ibin?.dimensiones||[]).sort((a,b)=>a.score-b.score).slice(0,2).map(x=>x.nombre).join(' y ');return `La empresa presenta un IBIN de ${i} (${level(i)}). Las principales oportunidades se concentran en ${top||'las dimensiones con mayor brecha'}. La evidencia disponible sugiere que el mayor valor no está en sumar actividades aisladas, sino en implementar un programa breve, práctico y medible que conecte las necesidades del equipo con la realidad operacional y la prevención cardiometabólica. Se recomienda comenzar con Detecta y Recarga, activar microacciones y cerrar con una reevaluación que permita decidir qué sostener, ajustar o escalar.`}
window.NutreteIntegrated={render}; window.NUTRETE_INTEGRATED_DATA=window.NUTRETE_INTEGRATED_DATA||DEMO; render(window.NUTRETE_INTEGRATED_DATA); document.getElementById('btnDemo').onclick=()=>render(DEMO);
</script>
