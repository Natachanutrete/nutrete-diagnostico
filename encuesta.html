<!DOCTYPE html>

<style>

  body {

    font-weight: 800;
    color: white;
    letter-spacing: -0.3px;
  }

  .header-marca span {
    display: inline-block;
    width: 8px; height: 8px;
    background: #7fc89a;
    border-radius: 50%;
    margin-left: 3px;
    vertical-align: middle;

  .header-sub {

  .card {
    background: white;
    border-radius: 14px;

    margin-bottom: 20px;

  .pregunta-bloque {

  .pregunta-bloque:last-child { border-bottom: none; padding-bottom: 0; }
  .pregunta-bloque:first-of-type { padding-top: 0; }

  .pregunta-texto {
    font-size: 14px;
    font-weight: 600;

    line-height: 1.5;

  .opcion-radio {

    margin-bottom: 6px;

  .escala-btn {
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1.5px solid var(--gris-borde);
    background: white;
    font-size: 16px;
    font-weight: 700;

    justify-content: space-between;
    font-size: 11px;
    color: var(--texto-suave);
    margin-top: 4px;

    color: var(--texto-suave);

    font-weight: 500;
    margin-left: 8px;
    vertical-align: middle;

  .btn-enviar {

    padding: 16px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;

  .btn-enviar:disabled { background: #aaa; cursor: not-allowed; }

    text-align: center;
    padding: 60px 24px;
  }

  .estado-icono { font-size: 56px; margin-bottom: 20px; }

  .estado-titulo {
    font-size: 22px;
    font-weight: 800;
    color: var(--verde-oscuro);
    margin-bottom: 10px;
  }

  .estado-texto {
    font-size: 15px;
    color: var(--texto-suave);
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .firma {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--gris-borde);
    padding: 18px 24px;
    display: inline-block;
  }

  .firma-nombre {
    font-size: 15px;
    font-weight: 700;
    color: var(--verde-oscuro);
  }

  .firma-tagline {
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 3px;
  }

  .loading-pantalla {
    text-align: center;
    padding: 80px 24px;
    color: var(--texto-suave);
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--gris-borde);
    border-top-color: var(--verde);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
    .escala-btn { width: 44px; height: 44px; font-size: 15px; }
  }
</style>
</head>

    <div class="spinner"></div>

<script>
const SUPABASE_URL = 'https://jpybenygergddnksbwzg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpweWJlbnlnZXJnZGRua3Nid3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjMzOTUsImV4cCI6MjEwMzY5OTM5NX0.-KTVBiXLwvQzmRg7BqG5GmH8O2YEk08c3IuRM-VwTeE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async () => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (!token) {
    mostrarError('Link inválido', 'Este link no contiene un token de encuesta válido.');
    return;
  }

  const { data: encuesta, error } = await sb.from('encuestas')
    .select('*, evaluacion:evaluacion_id(nombre_sesion, empresa:empresa_id(nombre))')
    .eq('token', token)
    .single();

  if (error || !encuesta) {
    mostrarError('Encuesta no encontrada', 'Este link no existe o ha expirado.');
    return;
  }

  if (!encuesta.activa) {
    mostrarError('Encuesta cerrada', 'Esta encuesta ya no está disponible. Contacta a tu encargado de bienestar.');
    return;
  }

  const empresa = encuesta.evaluacion?.empresa?.nombre || '';
  document.getElementById('header-sub').textContent =
    `${encuesta.tipo === 'gerencia' ? 'Diagnóstico Organizacional' : 'Encuesta de Bienestar'} — ${empresa}`;

  if (encuesta.tipo === 'gerencia') {
    mostrarFormGerencia(token, encuesta.id, empresa);
  } else {
    mostrarFormColaborador(token, encuesta.id, empresa);
  }
})();

function toggleSeccion(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// Inicializar fecha de hoy en formulario de gerencia
setTimeout(() => {
  const fechaEl = document.getElementById('org-fecha');
  if (fechaEl && !fechaEl.value) fechaEl.value = new Date().toISOString().split('T')[0];
}, 100);


async function enviarGerencia(encuestaId) {
  // Validar checkbox de confidencialidad
  if (!document.getElementById('acepta-confidencialidad')?.checked) {
    alert('Debes aceptar las condiciones de confidencialidad para continuar.');
    return;
  }

  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const getRadio = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value || null;
  const getCheck = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
  const getText = (id) => document.getElementById(id)?.value?.trim() || null;
  const getEscala = (grupo) => {
    const b = document.querySelector(`[data-grupo="${grupo}"].seleccionado`);
    return b ? parseInt(b.dataset.val) : null;
  };

  const datos = {
    // Datos de la organización
    org_empresa: getText('org-empresa'),
    org_contacto: getText('org-contacto'),
    org_cargo: getText('org-cargo'),
    org_email: getText('org-email'),
    org_sede: getText('org-sede'),
    org_fecha: getText('org-fecha'),
    // A. Contexto
    num_trabajadores: getRadio('num_trabajadores'),
    num_centros: getRadio('num_centros'),
    tipos_turno: getCheck('tipos_turno'),
    modalidad: getRadio('modalidad'),
    rango_etario: getCheck('rango_etario'),
    sectores: getCheck('sectores'),
    certificacion: getRadio('certificacion'),
    receptividad: getRadio('receptividad'),
    // B. Estrategia
    tiene_estrategia: getRadio('tiene_estrategia'),
    frecuencia_bienestar: getRadio('frecuencia_bienestar'),
    areas_bienestar: getCheck('areas_bienestar'),
    lider_bienestar: getRadio('lider_bienestar'),
    presupuesto_existe: getRadio('presupuesto_existe'),
    presupuesto_rango: getRadio('presupuesto_rango'),
    tiene_sence: getRadio('tiene_sence'),
    tiene_chilecompra: getRadio('tiene_chilecompra'),
    // C. Salud del equipo
    problemas_salud: getCheck('problemas_salud'),
    sedentarismo_visible: getRadio('sedentarismo_visible'),
    ausentismo: getRadio('ausentismo'),
    problemas_sueno: getRadio('problemas_sueno'),
    habitos_alimentacion: getCheck('habitos_alimentacion'),
    tiempo_alimentacion: getRadio('tiempo_alimentacion'),
    tipo_alimentos: getRadio('tipo_alimentos'),
    acceso_refrigerador: getRadio('acceso_refrigerador'),
    tipo_casino: getCheck('tipo_casino'),
    conformidad_casino: getRadio('conformidad_casino'),
    // D. Entorno y participación
    pausas_activas: getRadio('pausas_activas'),
    acceso_agua: getRadio('acceso_agua'),
    espacios_deporte: getRadio('espacios_deporte'),
    infraestructura: getCheck('infraestructura'),
    dificultades_turnos: getRadio('dificultades_turnos'),
    participacion_prev: getRadio('participacion_prev'),
    actividades_populares: getCheck('actividades_populares'),
    dificultades_participacion: getCheck('dificultades_participacion'),
    // E. Necesidades y medición
    necesidades_percibidas: getCheck('necesidades_percibidas'),
    indicadores_mejorar: getCheck('indicadores_mejorar'),
    mide_bienestar: getRadio('mide_bienestar'),
    indicadores_actuales: getCheck('indicadores_actuales'),
    eval_prev: getRadio('eval_prev'),
    tiene_historicos: getRadio('tiene_historicos'),
    exito_bienestar: getText('exito_bienestar'),
    // F. Temas de interés (escala 1-5)
    tema_alimentacion: getEscala('tema_alimentacion'),
    tema_estres: getEscala('tema_estres'),
    tema_sueno: getEscala('tema_sueno'),
    tema_hidratacion: getEscala('tema_hidratacion'),
    tema_energia: getEscala('tema_energia'),
    tema_cronicas: getEscala('tema_cronicas'),
    tema_hormonal: getEscala('tema_hormonal'),
    tema_plantas: getEscala('tema_plantas'),
    tema_aromaterapia: getEscala('tema_aromaterapia'),
    tema_colaciones: getEscala('tema_colaciones'),
    tema_checkup: getEscala('tema_checkup'),
  };

  const { error } = await sb.from('respuestas_encuesta').insert({
    encuesta_id: encuestaId,
    autopercepcion_salud: JSON.stringify(datos),
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Enviar diagnóstico';
    alert('Hubo un error al enviar. Intenta de nuevo.');
    return;
  }

  mostrarGracias();
}

    <div class="estado-pantalla">
      <div class="estado-icono">🌿</div>

function radio(name, opciones) {
  return opciones.map(o =>
    `<label class="opcion-radio"><input type="radio" name="${name}" value="${o}"> ${o}</label>`
  ).join('');
}

function checkbox(name, opciones) {
  return opciones.map(([val, label]) =>
    `<label class="opcion-radio"><input type="checkbox" name="${name}" value="${val}"> ${label}</label>`
  ).join('');
}

function escala(grupo, labelMin, labelMax) {
  return `
    <div class="escala-likert">
      ${[1,2,3,4,5].map(n =>
        `<button class="escala-btn" onclick="seleccionarEscala(this,'${grupo}')" data-grupo="${grupo}" data-val="${n}">${n}</button>`
      ).join('')}
    </div>
    <div class="escala-labels"><span>${labelMin}</span><span>${labelMax}</span></div>
  `;
}

function seleccionarEscala(btn, grupo) {
  document.querySelectorAll(`[data-grupo="${grupo}"]`).forEach(b => b.classList.remove('seleccionado'));
  btn.classList.add('seleccionado');
}
</script>
</body>
