<!DOCTYPE html>

<style>

    font-weight: 800;

  }

  .header-marca span {
    display: inline-block;
    width: 8px; height: 8px;

  .card {
    background: white;
    border-radius: 14px;
    padding: 28px;
    box-shadow: var(--sombra);
    border: 1px solid var(--gris-borde);
    margin-bottom: 20px;

  .seccion-label {

  .pregunta-bloque {

  .pregunta-bloque:last-child { border-bottom: none; padding-bottom: 0; }
  .pregunta-bloque:first-of-type { padding-top: 0; }

  .pregunta-texto {

    font-weight: 600;
    color: var(--texto);

    flex-direction: column;
    gap: 10px;

  .opcion-radio {

    gap: 10px;
    font-size: 14px;
    cursor: pointer;
    color: var(--texto);

    width: 16px; height: 16px;
  }

  .escala-likert {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .escala-btn {
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1.5px solid var(--gris-borde);
    background: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--texto);

  .escala-btn.seleccionado { background: var(--verde); color: white; border-color: var(--verde); }

    justify-content: space-between;
    font-size: 11px;
    color: var(--texto-suave);
    margin-top: 4px;

    background: #f0f7f3;
    color: var(--texto-suave);

    font-weight: 500;
    margin-left: 8px;

    padding: 16px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;

    text-align: center;
    padding: 60px 24px;
  }

  .estado-icono { font-size: 56px; margin-bottom: 20px; }

  .estado-titulo {
    font-size: 22px;
    font-weight: 800;
    color: var(--verde-oscuro);
    margin-bottom: 10px;
  }

  .estado-texto {
    font-size: 15px;
    color: var(--texto-suave);
    line-height: 1.7;
    margin-bottom: 28px;
  }

    background: white;
    border-radius: 12px;
    border: 1px solid var(--gris-borde);
    padding: 18px 24px;
    display: inline-block;
  }

  .firma-nombre {
    font-size: 15px;
    font-weight: 700;
    color: var(--verde-oscuro);
  }

  .firma-tagline {
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 3px;
  }

  .loading-pantalla {
    text-align: center;
    padding: 80px 24px;
    color: var(--texto-suave);
  }

    width: 36px; height: 36px;
    border: 3px solid var(--gris-borde);

    margin: 0 auto 16px;
  }

    .escala-btn { width: 44px; height: 44px; font-size: 15px; }

</style>
</head>

<script>
const SUPABASE_URL = 'https://jpybenygergddnksbwzg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpweWJlbnlnZXJnZGRua3Nid3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjMzOTUsImV4cCI6MjEwMzY5OTM5NX0.-KTVBiXLwvQzmRg7BqG5GmH8O2YEk08c3IuRM-VwTeE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async () => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (!token) {
    mostrarError('Link inválido', 'Este link no contiene un token de encuesta válido.');
    return;
  }

  const { data: encuesta, error } = await sb.from('encuestas')
    .select('*, evaluacion:evaluacion_id(nombre_sesion, empresa:empresa_id(nombre))')
    .eq('token', token)
    .single();

  if (error || !encuesta) {
    mostrarError('Encuesta no encontrada', 'Este link no existe o ha expirado.');
    return;
  }

  if (!encuesta.activa) {
    mostrarError('Encuesta cerrada', 'Esta encuesta ya no está disponible. Contacta a tu encargado de bienestar.');
    return;
  }

  const empresa = encuesta.evaluacion?.empresa?.nombre || '';
  document.getElementById('header-sub').textContent =
    `${encuesta.tipo === 'gerencia' ? 'Diagnóstico Organizacional' : 'Encuesta de Bienestar'} — ${empresa}`;

  if (encuesta.tipo === 'gerencia') {
    mostrarFormGerencia(token, encuesta.id, empresa);
  } else {
    mostrarFormColaborador(token, encuesta.id, empresa);
  }
})();

          ${radio('dificultades_turnos', ['Sí, es una problemática relevante','Algunas dificultades menores','No tenemos problemas relevantes','No aplica — no hay trabajo por turnos'])}
        </div>
      </div>
    </div>

    <!-- 5. PERCEPCIÓN DE RRHH -->
    <div class="card">
      <div class="seccion-label">5. Percepción y objetivos de RRHH</div>

      <div class="pregunta-bloque">
        <div class="pregunta-texto">¿Qué indicadores de bienestar les gustaría mejorar en los próximos 12 meses? (puedes marcar varias)</div>
        <div class="opciones-radio">
          ${checkbox('indicadores_mejorar', [
            ['participacion','Participación en actividades'],
            ['habitos','Hábitos saludables de los trabajadores'],
            ['satisfaccion','Satisfacción de los trabajadores'],
            ['estres','Estrés laboral'],
            ['fatiga','Fatiga y agotamiento'],
            ['ausentismo','Ausentismo y licencias médicas'],
            ['clima','Clima laboral'],
            ['engagement','Engagement y compromiso'],
            ['productividad','Productividad'],
            ['retencion','Retención de talentos'],
            ['otro','Otro'],
          ])}
        </div>
      </div>

      <div class="pregunta-bloque">
        <div class="pregunta-texto">¿Tienen datos de ausentismo o licencias médicas frecuentes?</div>
        <div class="opciones-radio">
          ${radio('ausentismo', ['Sí, es un problema relevante','Algunos casos aislados','Tenemos datos pero son bajos','No tenemos datos claros'])}
        </div>
      </div>

      <div class="pregunta-bloque">
        <div class="pregunta-texto">¿Cómo sabrían que un programa de bienestar fue exitoso? (texto libre)</div>
        <textarea name="exito_bienestar" id="exito_bienestar" style="width:100%;padding:10px 12px;border:1.5px solid var(--gris-borde);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:80px;margin-top:8px;" placeholder="Describa qué resultados o cambios esperaría observar..."></textarea>
      </div>
    </div>

    <!-- 6. MEDICIÓN ACTUAL -->
    <div class="card">
      <div class="seccion-label">6. Medición actual</div>

      <div class="pregunta-bloque">
        <div class="pregunta-texto">¿La empresa mide actualmente indicadores relacionados con bienestar?</div>
        <div class="opciones-radio">
          ${radio('mide_bienestar', ['Sí, con indicadores formales y regulares','Sí, pero de forma informal o esporádica','No medimos actualmente'])}
        </div>
      </div>

      <div class="pregunta-bloque">
        <div class="pregunta-texto">¿Qué indicadores miden actualmente? (puedes marcar varias)</div>
        <div class="opciones-radio">
          ${checkbox('indicadores_actuales', [
            ['ausentismo','Ausentismo'],
            ['licencias','Licencias médicas'],
            ['satisfaccion','Encuestas de satisfacción'],
            ['clima','Clima organizacional'],
            ['accidentabilidad','Accidentabilidad'],
            ['rotacion','Rotación de personal'],
            ['ningunos','No medimos indicadores de bienestar'],
          ])}
        </div>
      </div>

      <div class="pregunta-bloque">
        <div class="pregunta-texto">¿Han realizado evaluaciones de salud o hábitos anteriormente?</div>
        <div class="opciones-radio">
          ${radio('eval_prev', ['Sí, con resultados documentados','Sí, pero sin resultados formales','No hemos realizado evaluaciones'])}
        </div>
      </div>

      <div class="pregunta-bloque">
        <div class="pregunta-texto">¿Tienen resultados históricos para comparar?</div>
        <div class="opciones-radio">
          ${radio('tiene_historicos', ['Sí, datos de al menos 1 año','Algunos datos parciales','No tenemos datos históricos'])}
        </div>
      </div>
    </div>

    <button class="btn-enviar" id="btn-enviar" onclick="enviarGerencia('${encuestaId}')">
      Enviar diagnóstico
    </button>
  `;
}

// ══════════════════════════════════════════════
// ENVIAR RESPUESTAS
// ══════════════════════════════════════════════
async function enviarColaborador(encuestaId) {
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const getRadio = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value || null;
  const getEscalaVal = (grupo) => {
    const b = document.querySelector(`[data-grupo="${grupo}"].seleccionado`);
    return b ? parseInt(b.dataset.val) : null;
  };
  const getCheck = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);

  const sueno = getRadio('sueno');
  const agua = getRadio('agua');

  const { error } = await sb.from('respuestas_encuesta').insert({
    encuesta_id: encuestaId,
    frecuencia_desayuno: getRadio('desayuno'),
    lugar_almuerzo: getRadio('almuerzo'),
    calidad_alimentacion_percibida: getEscalaVal('calidad'),
    horas_sueno: sueno === 'Menos de 5 horas' ? 4.5 : sueno === '5-6 horas' ? 5.5 : sueno === '7-8 horas' ? 7.5 : 8.5,
    actividad_fisica_frecuencia: getRadio('actividad'),
    consumo_agua_litros: agua === 'Menos de 1 litro' ? 0.5 : agua === '1-1.5 litros' ? 1.25 : agua === '1.5-2 litros' ? 1.75 : 2.5,
    nivel_estres: getEscalaVal('estres'),
    bienestar_general: getEscalaVal('bienestar'),
    interes_aromaterapia: getCheck('intereses').includes('aromaterapia'),
    interes_fitoterapia: getCheck('intereses').includes('fitoterapia'),
    interes_checkup: getCheck('intereses').includes('checkup'),
    interes_talleres: getCheck('intereses').includes('talleres'),
    autopercepcion_salud: getRadio('salud'),
    condiciones_diagnosticadas: getCheck('condiciones'),
    disposicion_checkup: getRadio('checkup_interes') === 'Sí, me interesa',
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Enviar respuestas';
    alert('Hubo un error al enviar. Intenta de nuevo.');
    return;
  }

  mostrarGracias();
}

async function enviarGerencia(encuestaId) {
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const getRadio = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value || null;
  const getCheck = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
  const getText = (id) => document.getElementById(id)?.value?.trim() || null;

  const datos = {
    // A. Empresa
    num_trabajadores: getRadio('num_trabajadores'),
    num_centros: getRadio('num_centros'),
    tipo_jornada: getRadio('tipo_jornada'),
    tiene_turnos: getRadio('tiene_turnos'),
    // 1. Estrategia
    tiene_estrategia: getRadio('tiene_estrategia'),
    areas_bienestar: getCheck('areas_bienestar'),
    frecuencia_bienestar: getRadio('frecuencia_bienestar'),
    presupuesto: getRadio('presupuesto'),
    lider_bienestar: getRadio('lider_bienestar'),
    // 2. Participación
    participacion_prev: getRadio('participacion_prev'),
    actividades_populares: getCheck('actividades_populares'),
    diferencias_participacion: getRadio('diferencias_participacion'),
    dificultades_participacion: getCheck('dificultades_participacion'),
    // 3. Necesidades
    necesidades_percibidas: getCheck('necesidades_percibidas'),
    // 4. Entorno
    tiene_casino: getRadio('tiene_casino'),
    disponibilidad_saludable: getRadio('disponibilidad_saludable'),
    pausas_activas: getRadio('pausas_activas'),
    acceso_agua: getRadio('acceso_agua'),
    espacios_deporte: getRadio('espacios_deporte'),
    dificultades_turnos: getRadio('dificultades_turnos'),
    // 5. RRHH
    indicadores_mejorar: getCheck('indicadores_mejorar'),
    ausentismo: getRadio('ausentismo'),
    exito_bienestar: getText('exito_bienestar'),
    // 6. Medición
    mide_bienestar: getRadio('mide_bienestar'),
    indicadores_actuales: getCheck('indicadores_actuales'),
    eval_prev: getRadio('eval_prev'),
    tiene_historicos: getRadio('tiene_historicos'),
  };

  const { error } = await sb.from('respuestas_encuesta').insert({
    encuesta_id: encuestaId,
    autopercepcion_salud: JSON.stringify(datos),
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Enviar diagnóstico';
    alert('Hubo un error al enviar. Intenta de nuevo.');
    return;
  }

  mostrarGracias();
}

function mostrarGracias() {
  document.getElementById('contenido').innerHTML = `
    <div class="estado-pantalla">
      <div class="estado-icono">🌿</div>
      <div class="estado-titulo">¡Gracias por responder!</div>
      <p class="estado-texto">
        Tus respuestas han sido registradas de forma anónima.<br>
        El equipo de Nútrete las usará para diseñar un programa<br>
        de bienestar a la medida de tu equipo.
      </p>
      <div class="firma">
        <div class="firma-nombre">Nútrete®</div>
        <div class="firma-tagline">El Método Nútrete® desarrolla el Criterio para la Salud.</div>
      </div>
    </div>
  `;
}

function mostrarError(titulo, texto) {
  document.getElementById('header-sub').textContent = '';
  document.getElementById('contenido').innerHTML = `
    <div class="estado-pantalla">
      <div class="estado-icono">🔒</div>
      <div class="estado-titulo">${titulo}</div>
      <p class="estado-texto">${texto}</p>
    </div>
  `;
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function radio(name, opciones) {
  return opciones.map(o =>
    `<label class="opcion-radio"><input type="radio" name="${name}" value="${o}"> ${o}</label>`
  ).join('');
}

function checkbox(name, opciones) {
  return opciones.map(([val, label]) =>
    `<label class="opcion-radio"><input type="checkbox" name="${name}" value="${val}"> ${label}</label>`
  ).join('');
}

function escala(grupo, labelMin, labelMax) {
  return `
    <div class="escala-likert">
      ${[1,2,3,4,5].map(n =>
        `<button class="escala-btn" onclick="seleccionarEscala(this,'${grupo}')" data-grupo="${grupo}" data-val="${n}">${n}</button>`
      ).join('')}
    </div>
    <div class="escala-labels"><span>${labelMin}</span><span>${labelMax}</span></div>
  `;
}

function seleccionarEscala(btn, grupo) {
  document.querySelectorAll(`[data-grupo="${grupo}"]`).forEach(b => b.classList.remove('seleccionado'));
  btn.classList.add('seleccionado');
}
</script>
