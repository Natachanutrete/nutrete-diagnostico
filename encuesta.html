const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async () => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (!token) {
    mostrarError('Link inválido', 'Este link no contiene un token de encuesta válido.');
    return;
  }

  const { data: encuesta, error } = await sb.from('encuestas')
    .select('*, evaluacion:evaluacion_id(nombre_sesion, empresa:empresa_id(nombre))')
    .eq('token', token)
    .single();

  if (error || !encuesta) {
    mostrarError('Encuesta no encontrada', 'Este link no existe o ha expirado.');
    return;
  }

  if (!encuesta.activa) {
    mostrarError('Encuesta cerrada', 'Esta encuesta ya no está disponible. Contacta a tu encargado de bienestar.');
    return;
  }

  const empresa = encuesta.evaluacion?.empresa?.nombre || '';
  document.getElementById('header-sub').textContent =
    `${encuesta.tipo === 'gerencia' ? 'Diagnóstico Organizacional' : 'Encuesta de Bienestar'} — ${empresa}`;

  if (encuesta.tipo === 'gerencia') {
    mostrarFormGerencia(token, encuesta.id, empresa);
  } else {
    mostrarFormColaborador(token, encuesta.id, empresa);
  }
})();

async function enviarColaborador(encuestaId) {
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const getRadio = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value || null;
  const getCheck = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
  const getEscalaVal = (grupo) => {
    const b = document.querySelector(`[data-grupo="${grupo}"].seleccionado`);
    return b ? parseInt(b.dataset.val) : null;
  };
  const getText = (id) => document.getElementById(id)?.value?.trim() || null;

  const datos = {
    // S1 — Información general
    area_dept: getRadio('area_dept'),
    rango_edad: getRadio('rango_edad'),
    modalidad_trabajo: getRadio('modalidad_trabajo'),
    antiguedad: getRadio('antiguedad'),
    // S2 — Bienestar general
    bienestar_general: getEscalaVal('bienestar_general'),
    satisfaccion_vida: getEscalaVal('satisfaccion_vida'),
    herramientas_bienestar: getEscalaVal('herramientas_bienestar'),
    prioridad_bienestar: getEscalaVal('prioridad_bienestar'),
    // S3 — Alimentación
    calidad_alimentacion: getEscalaVal('calidad_alimentacion'),
    frutas_verduras: getRadio('frutas_verduras'),
    ultraprocesados: getRadio('ultraprocesados'),
    acceso_saludable: getEscalaVal('acceso_saludable'),
    jornada_dificulta_alim: getEscalaVal('jornada_dificulta_alim'),
    comidas_tranquilas: getRadio('comidas_tranquilas'),
    // S4 — Movimiento
    dias_actividad: getRadio('dias_actividad'),
    tiempo_sedentario: getRadio('tiempo_sedentario'),
    pausas_movimiento: getEscalaVal('pausas_movimiento'),
    trabajo_facilita_actividad: getEscalaVal('trabajo_facilita_actividad'),
    // S5 — Sueño
    horas_sueno: getRadio('horas_sueno'),
    calidad_sueno: getEscalaVal('calidad_sueno'),
    descansado_amanecer: getEscalaVal('descansado_amanecer'),
    trabajo_afecta_sueno: getEscalaVal('trabajo_afecta_sueno'),
    // S6 — Energía
    nivel_energia: getEscalaVal('nivel_energia'),
    cansancio_jornada: getEscalaVal('cansancio_jornada'),
    momento_baja_energia: getRadio('momento_baja_energia'),
    habitos_energia: getEscalaVal('habitos_energia'),
    // S7 — Estrés
    carga_laboral: getEscalaVal('carga_laboral'),
    desconexion_trabajo: getEscalaVal('desconexion_trabajo'),
    herramientas_estres: getEscalaVal('herramientas_estres'),
    apoyo_laboral: getEscalaVal('apoyo_laboral'),
    estrategias_estres: getCheck('estrategias_estres'),
    // S8 — Entorno laboral
    ambiente_laboral: getEscalaVal('ambiente_laboral'),
    opiniones_escuchadas: getEscalaVal('opiniones_escuchadas'),
    respeto_laboral: getEscalaVal('respeto_laboral'),
    carga_adecuada: getEscalaVal('carga_adecuada'),
    autonomia_trabajo: getEscalaVal('autonomia_trabajo'),
    trabajo_facilita_habitos: getEscalaVal('trabajo_facilita_habitos'),
    cultura_bienestar: getEscalaVal('cultura_bienestar'),
    // S9 — Autocuidado
    facilidad_autocuidado: getEscalaVal('facilidad_autocuidado'),
    areas_fortalecer: getCheck('areas_fortalecer'),
    // S10 — Fitoterapia
    uso_plantas: getRadio('uso_plantas'),
    interes_plantas: getCheck('interes_plantas'),
    interes_taller_plantas: getEscalaVal('interes_taller_plantas'),
    interes_aromaterapia: getEscalaVal('interes_aromaterapia'),
    otras_actividades: getCheck('otras_actividades'),
    // S11 — Prioridades
    temas_apoyo: getCheck('temas_apoyo'),
    formato_preferido: getCheck('formato_preferido'),
    frecuencia_participacion: getRadio('frecuencia_participacion'),
    // S12 — Abiertas
    abierta_bienestar_jornada: getText('abierta_1'),
    abierta_cambio_entorno: getText('abierta_2'),
    abierta_temas_adicionales: getText('abierta_3'),
  };

  const { error } = await sb.from('respuestas_encuesta').insert({
    encuesta_id: encuestaId,
    // Campos compatibles con tabla existente
    nivel_estres: datos.carga_laboral,
    bienestar_general: datos.bienestar_general,
    calidad_alimentacion_percibida: datos.calidad_alimentacion,
    horas_sueno: datos.horas_sueno === 'Menos de 5 horas' ? 4.5 :
                 datos.horas_sueno === '5–6 horas' ? 5.5 :
                 datos.horas_sueno === '6–7 horas' ? 6.5 :
                 datos.horas_sueno === '7–8 horas' ? 7.5 : 8.5,
    actividad_fisica_frecuencia: datos.dias_actividad,
    interes_aromaterapia: (datos.interes_aromaterapia || 0) >= 4,
    interes_fitoterapia: (datos.interes_taller_plantas || 0) >= 4,
    interes_checkup: (datos.temas_apoyo || []).includes('cronicas_pr'),
    interes_talleres: (datos.formato_preferido || []).includes('talleres_prac'),
    // Resto completo en JSON
    autopercepcion_salud: JSON.stringify(datos),
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Enviar respuestas';
    alert('Hubo un error al enviar. Intenta de nuevo.');
    return;
  }

  // Calcular scoring individual con Motor Nútrete® (silencioso)
  if (typeof NutreteScoring !== 'undefined') {
    try {
      const scoringIndividual = {
        IBP: NutreteScoring.Dimensiones.bienestarPercibido(datos),
        IA:  NutreteScoring.Dimensiones.alimentacion(datos),
        IM:  NutreteScoring.Dimensiones.movimiento(datos),
        IR:  NutreteScoring.Dimensiones.recuperacion(datos),
        IV:  NutreteScoring.Dimensiones.vitalidad(datos),
        IER: NutreteScoring.Dimensiones.estresRecursos(datos),
        IES: NutreteScoring.Dimensiones.entornoSaludable(datos),
      };
      const ibin = NutreteScoring.calcularIBIN(scoringIndividual);
      console.log('Scoring Nútrete® calculado:', { ...scoringIndividual, IBIN: ibin });
    } catch(e) { /* silencioso */ }
  }

  mostrarGracias();
}

    return;
  }

  mostrarGracias();
}


function mostrarGracias() {
  document.getElementById('contenido').innerHTML = `
    <div class="estado-pantalla">
      <div class="estado-icono">🌿</div>
      <div class="estado-titulo">¡Gracias por responder!</div>
      <p class="estado-texto">
        Tus respuestas han sido registradas de forma anónima.<br>
        El equipo de Nútrete las usará para diseñar un programa<br>
        de bienestar a la medida de tu equipo.
      </p>
      <div class="firma">
        <div class="firma-nombre">Nútrete®</div>
        <div class="firma-tagline">El Método Nútrete® desarrolla el Criterio para la Salud.</div>
      </div>
    </div>
  `;
}

function mostrarError(titulo, texto) {
  document.getElementById('header-sub').textContent = '';
  document.getElementById('contenido').innerHTML = `
    <div class="estado-pantalla">
      <div class="estado-icono">🔒</div>
      <div class="estado-titulo">${titulo}</div>
      <p class="estado-texto">${texto}</p>
    </div>
  `;
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function radio(name, opciones) {
  return opciones.map(o =>
    `<label class="opcion-radio"><input type="radio" name="${name}" value="${o}"> ${o}</label>`
  ).join('');
}

function checkbox(name, opciones) {
  return opciones.map(([val, label]) =>
    `<label class="opcion-radio"><input type="checkbox" name="${name}" value="${val}"> ${label}</label>`
  ).join('');
}

function escala(grupo, labelMin, labelMax) {
  return `
    <div class="escala-likert">
      ${[1,2,3,4,5].map(n =>
        `<button class="escala-btn" onclick="seleccionarEscala(this,'${grupo}')" data-grupo="${grupo}" data-val="${n}">${n}</button>`
      ).join('')}
    </div>
    <div class="escala-labels"><span>${labelMin}</span><span>${labelMax}</span></div>
  `;
}

function seleccionarEscala(btn, grupo) {
  document.querySelectorAll(`[data-grupo="${grupo}"]`).forEach(b => b.classList.remove('seleccionado'));
  btn.classList.add('seleccionado');
}
</script>
